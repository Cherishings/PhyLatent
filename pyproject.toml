[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylatent"
version = "0.1.0"
description = "PhyLatent base training, ablations, and planning diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.7", "torchvision>=0.22", "transformers>=4.46,<6", "einops>=0.8", "numpy>=1.26", "hydra-core==1.3.2", "omegaconf==2.3.0"]

[project.optional-dependencies]
runtime = ["lightning>=2.5,<3", "stable-pretraining==0.1.7", "stable-worldmodel==0.1.1", "h5py>=3.10", "hdf5plugin>=5", "scikit-learn>=1.5", "gymnasium>=1.0", "ogbench>=1.2", "dm-control>=1.0", "mujoco>=3", "pymunk>=6", "zstandard>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]
